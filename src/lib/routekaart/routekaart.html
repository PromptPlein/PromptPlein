<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__ROUTEKAART_TITEL__</title>
<!-- Gemaakt met de vaste routekaart van PromptPlein. Alleen de inhoud in
     rk-data verschilt per routekaart; de opmaak en de beweging zijn steeds gelijk. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --donkerblauw: #154273;
  --blauw: #01689B;
  --geel: #F9E11E;
  --rood: #D52B1E;
  --lichtblauw: #EAF2F9;
  --bg: #ffffff;
  --tekst: #1d2b3a;
  --zacht: #5b6b7f;
  --lijn: #d3dce6;
  --weg: #dbe3ec;
  --kop: var(--donkerblauw);
  --accent: var(--blauw);
  --draad: var(--rood);
  --paneel: var(--lichtblauw);
  --kaart: #ffffff;
  --kaart-bezocht: #fff6f5;
  --vlak: var(--donkerblauw);
  --vlak-tekst: #ffffff;
  --gepland: #9aabbf;
  --op-geel: #1d2b3a;
  --focus: #01689B;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1828;
    --tekst: #e2e9f2;
    --zacht: #9db0c6;
    --lijn: #2a3c54;
    --weg: #2b3e58;
    --kop: #d4e3f6;
    --accent: #7cc7ee;
    --draad: #ff5d50;
    --paneel: #15273f;
    --kaart: #12213a;
    --kaart-bezocht: #2a1c22;
    --vlak: #1c3b66;
    --vlak-tekst: #f2f6fb;
    --gepland: #5f7590;
    --focus: #7cc7ee;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--tekst);
  font-family: "Public Sans", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
.geelbalk { height: 10px; background: var(--geel); }
.rk { max-width: 1440px; margin: 0 auto; padding: 28px 32px 40px; }
.open { text-decoration: underline dotted; text-underline-offset: 3px; }
.ico { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Kop */
.bovenregel { margin: 0 0 10px; font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.titelblok { border-left: 8px solid var(--kop); padding: 2px 0 4px 22px; }
.titelblok h1 { margin: 0; font-size: clamp(30px, 4.2vw, 54px); line-height: 1.08; font-weight: 800; color: var(--kop); letter-spacing: -.01em; }
.ondertitel { margin: 12px 0 0; font-size: clamp(18px, 1.9vw, 25px); color: var(--zacht); }
.ondertitel .rood { color: var(--draad); text-decoration: underline wavy var(--draad); text-decoration-thickness: 1.5px; text-underline-offset: 6px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 22px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 3px; font-size: 15px; }
.chip.datum { padding-left: 0; color: var(--zacht); }
.chip.stand { background: var(--geel); color: var(--op-geel); font-weight: 700; }

/* Balk met legenda en bediening */
.balk { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px 32px; margin: 30px 0 22px; }
.legenda { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0; padding: 0; list-style: none; font-size: 14px; color: var(--zacht); }
.legenda li { display: inline-flex; align-items: center; gap: 8px; }
.leg-lijn { width: 28px; height: 3px; background: var(--draad); border-radius: 2px; }
.leg-cirkel { width: 14px; height: 14px; border: 2.5px solid var(--kop); border-radius: 50%; }
.leg-label { width: 28px; height: 16px; border: 1.5px dashed var(--zacht); border-radius: 3px; }
.legenda .ico { font-size: 18px; color: var(--kop); }
.bediening { display: flex; flex-direction: column; gap: 8px; min-width: min(100%, 520px); }
.knoppen { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.knop { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1.5px solid var(--lijn); border-radius: 4px; background: var(--kaart); font-weight: 700; color: var(--kop); cursor: pointer; }
.knop:hover:not(:disabled) { border-color: var(--kop); }
.knop:disabled { opacity: .45; cursor: default; }
.knop.hoofd { background: var(--donkerblauw); border-color: var(--donkerblauw); color: #fff; min-width: 150px; }
@media (prefers-color-scheme: dark) { .knop.hoofd { background: #2c5a94; border-color: #2c5a94; } }
.knop .ico { font-size: 18px; }
.voortgang { height: 3px; background: var(--lijn); border-radius: 2px; overflow: hidden; }
.voortgang span { display: block; height: 100%; width: 0; background: var(--draad); }

/* Route, breed */
.route { position: relative; }
.rij { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); column-gap: 20px; margin: 0; padding: 0; list-style: none; }
.halte-kop { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; width: 100%; height: 100%; padding: 0 0 18px; border: 0; background: none; text-align: left; cursor: pointer; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; align-items: flex-end; margin-bottom: 4px; }
.geel-label, .vlag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; background: var(--geel); color: var(--op-geel); font-size: 12.5px; font-weight: 700; border-radius: 2px; }
.vlag .ico { font-size: 14px; }
.nummer { font-size: 13px; font-weight: 800; letter-spacing: .14em; color: var(--accent); }
.halte-titel { font-size: clamp(16px, 1.4vw, 23px); font-weight: 800; line-height: 1.18; color: var(--kop); }
.halte-datum { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--zacht); }
.kernvraag { margin-top: 6px; font-size: 15px; color: var(--accent); }
.halte-kop::after { content: ""; position: absolute; left: 0; bottom: 4px; width: 38px; height: 4px; background: var(--geel); opacity: 0; transition: opacity .25s; }
.halte-kop[aria-current="step"]::after { opacity: 1; }
.halte-kop.gepland .halte-titel, .halte-kop.gepland .nummer { opacity: .78; }

.weg { position: relative; height: 120px; }
.weg svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pad-grond { fill: none; stroke: var(--weg); stroke-width: 12; stroke-linecap: round; }
.pad-draad { fill: none; stroke: var(--draad); stroke-width: 5; stroke-linecap: round; }
.knoop { cursor: pointer; }
.knoop circle.rand { fill: var(--bg); stroke: var(--gepland); stroke-width: 3; transition: stroke .3s, fill .3s; }
.knoop.afgerond circle.rand { stroke: var(--kop); fill: var(--kop); }
.knoop.bezocht circle.rand { stroke: var(--draad); }
.knoop.afgerond.bezocht circle.rand { fill: var(--draad); }
.knoop .ico-in { color: var(--kop); }
.knoop.afgerond .ico-in, .knoop.afgerond.bezocht .ico-in { color: #fff; }
.ring { fill: none; stroke: var(--draad); stroke-width: 2.5; opacity: 0; transform-box: fill-box; transform-origin: center; }
.knoop.actief .ring { animation: puls 2s ease-out infinite; }
@keyframes puls { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.3); } }
.huisje path { fill: var(--bg); stroke: var(--kop); stroke-width: 1.8; stroke-linejoin: round; transition: stroke .3s; }
.huisje.voorbij path { stroke: var(--draad); }
.bol circle { fill: var(--draad); }
.bol .bol-ring { fill: none; stroke: var(--draad); stroke-opacity: .25; stroke-width: 6; }
.bol-ico { color: #fff; transform-box: fill-box; transform-origin: center; }
.bol-ico.pop, .lijst-bol.pop svg { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(.3); } 100% { transform: scale(1); } }

.opbrengst { display: flex; gap: 10px; align-items: flex-start; width: 100%; height: 100%; min-height: 100px; padding: 14px 14px 16px; border: 1.5px dashed var(--gepland); border-radius: 4px; background: var(--kaart); text-align: left; cursor: pointer; color: var(--zacht); transition: border-color .3s, background .3s, color .3s; }
.opbrengst .ico { font-size: 20px; margin-top: 1px; }
.opbrengst small { display: block; margin-bottom: 4px; font-size: 11.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.opbrengst span.tekst { font-size: 14.5px; line-height: 1.4; }
.opbrengst.bezocht { border: 1.5px solid var(--draad); background: var(--kaart-bezocht); color: var(--draad); }
.opbrengst.bezocht span.tekst { color: var(--tekst); }
.opbrengst.spring { animation: spring .55s cubic-bezier(.3, 1.4, .5, 1); }
@keyframes spring { 0% { transform: translateY(0); } 35% { transform: translateY(-10px); } 100% { transform: translateY(0); } }

/* Detailpaneel */
.detail { margin-top: 28px; padding: 26px 28px 28px; background: var(--paneel); border-top: 4px solid var(--kop); }
.detail-raster { display: grid; grid-template-columns: 1.25fr 1fr 1fr 1fr; gap: 28px; }
.detail h2 { margin: 4px 0 6px; font-size: clamp(20px, 2vw, 28px); line-height: 1.2; color: var(--kop); }
.detail h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--kop); }
.detail h3 .ico { font-size: 18px; }
.detail .kernvraag { margin: 0 0 12px; font-size: 16.5px; }
.detail ul { margin: 0; padding: 0; list-style: none; }
.detail li { position: relative; padding: 0 0 8px 16px; }
.detail li::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.detail .leeg { color: var(--zacht); font-size: 14.5px; }
.themas { display: flex; flex-wrap: wrap; gap: 6px; }
.thema { padding: 3px 9px; border: 1px solid var(--lijn); border-radius: 999px; background: var(--kaart); font-size: 12.5px; font-weight: 600; color: var(--kop); }
.status { display: inline-block; margin-bottom: 4px; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--zacht); }
.detail-opbrengst { display: flex; gap: 10px; color: var(--draad); }
.detail-opbrengst .ico { font-size: 24px; }
.detail-opbrengst span { color: var(--tekst); font-weight: 600; }
.finish-raster { display: grid; grid-template-columns: 1fr 2fr; gap: 36px; }
.uitkomsten li { display: flex; gap: 10px; align-items: center; padding: 0 0 12px; font-weight: 600; }
.uitkomsten li::before { display: none; }
.uitkomsten .ico { font-size: 24px; color: var(--draad); }
.keten { position: relative; display: grid; grid-template-columns: repeat(var(--k), minmax(0, 1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; }
.keten::before { content: ""; position: absolute; left: 22px; right: 22px; top: 22px; height: 3px; background: var(--draad); }
.keten li { position: relative; padding: 0; text-align: left; }
.keten li::before { display: none; }
.keten .schakel { position: relative; display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border: 2.5px solid var(--draad); border-radius: 50%; background: var(--kaart); color: var(--draad); }
.keten .schakel .ico { font-size: 22px; }
.keten span { display: block; margin-top: 8px; font-size: 13.5px; line-height: 1.35; }
.keten.inkomen li { animation: inkomen .5s both; animation-delay: calc(var(--i) * .35s); }
@keyframes inkomen { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Onderbalk */
.onderbalk { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; margin-top: 24px; }
.onderbalk.alleen { grid-template-columns: 1fr; }
.eind { padding: 22px 26px; background: var(--vlak); color: var(--vlak-tekst); border: 4px solid transparent; transition: border-color .4s, box-shadow .4s; }
.eind.bereikt { border-color: var(--geel); box-shadow: 0 0 0 6px rgba(249, 225, 30, .25); }
.eind h2, .werkwijze h2 { margin: 0 0 8px; font-size: 18px; }
.eind p { margin: 0; font-size: 17px; }
.werkwijze { padding: 22px 26px; background: var(--paneel); }
.werkwijze h2 { color: var(--kop); }
.werkwijze ul { margin: 0; padding: 0; list-style: none; }
.werkwijze li { display: flex; gap: 10px; align-items: flex-start; padding-bottom: 8px; }
.werkwijze .ico { font-size: 20px; color: var(--kop); margin-top: 1px; }

/* Route, smal: verticaal */
.lijst { display: none; position: relative; margin: 0; padding: 0; list-style: none; }
.lijst-rails, .lijst-draad { position: absolute; left: 19px; width: 4px; border-radius: 2px; }
.lijst-rails { background: var(--weg); }
.lijst-draad { background: var(--draad); height: 0; }
.lijst-bol { position: absolute; left: 3px; width: 36px; height: 36px; margin-top: -18px; border-radius: 50%; background: var(--draad); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 5px rgba(213, 43, 30, .2); z-index: 2; }
.lijst-bol .ico { font-size: 18px; }
.lijst > li { position: relative; padding: 0 0 26px 58px; }
.lijst .knoop-sm { position: absolute; left: 10px; top: 36px; width: 22px; height: 22px; border: 3px solid var(--gepland); border-radius: 50%; background: var(--bg); z-index: 1; }
.lijst .knoop-sm.afgerond { border-color: var(--kop); background: var(--kop); }
.lijst .knoop-sm.bezocht { border-color: var(--draad); }
.lijst .knoop-sm.afgerond.bezocht { background: var(--draad); }
.lijst .halte-kop { padding-bottom: 10px; }
.lijst .badges { min-height: 0; }
.lijst .opbrengst { min-height: 0; }
.lijst .detail { margin-top: 14px; padding: 18px; }
.lijst .tussen-sm { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13.5px; color: var(--zacht); }
.lijst .tussen-sm.voorbij { color: var(--draad); }

@media (max-width: 899px) {
  .rk { padding: 20px 16px 32px; }
  .route { display: none; }
  .lijst { display: block; }
  .balk { align-items: stretch; }
  .bediening { min-width: 100%; }
  .knoppen { justify-content: flex-start; }
  .knop { flex: 1 1 auto; padding: 0 12px; }
  .knop.hoofd { min-width: 0; }
  .detail-raster, .finish-raster { grid-template-columns: 1fr; gap: 18px; }
  .keten { grid-template-columns: 1fr; gap: 14px; }
  .keten::before { left: 22px; right: auto; top: 22px; bottom: 22px; width: 3px; height: auto; }
  .keten li { display: flex; align-items: center; gap: 12px; }
  .keten span { margin: 0; }
  .onderbalk { grid-template-columns: 1fr; }
  .eind, .werkwijze { padding: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<script>
(function () {
  'use strict';

  var DATA = JSON.parse(document.getElementById('rk-data').textContent);
  var SVGNS = 'http://www.w3.org/2000/svg';
  var ICONEN = ['vraagteken', 'canvas', 'blokjes', 'schild', 'proefbuis', 'doos', 'lamp', 'wegwijzer', 'vlag',
    'kalender', 'mensen', 'document', 'gesprek', 'doel', 'sleutel', 'grafiek', 'puzzel', 'ster'];
  var WACHT_MS = 7000;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var smalMedia = window.matchMedia('(max-width: 899px)');

  var kop = DATA.kop;
  var namen = DATA.namen;
  var S = DATA.stations;
  var N = S.length;
  var LAATSTE = N - 1;
  var standIndex = Math.max(0, Math.min(LAATSTE, DATA.standIndex || 0));

  /* Hulpjes */

  function cubic(p0, p1, p2, p3, t) {
    var u = 1 - t;
    return {
      x: u * u * u * p0.x + 3 * u * u * t * p1.x + 3 * u * t * t * p2.x + t * t * t * p3.x,
      y: u * u * u * p0.y + 3 * u * u * t * p1.y + 3 * u * t * t * p2.y + t * t * t * p3.y
    };
  }
  /* Bouwt de weg en een opzoektabel van booglengte naar punt, zodat de bol gelijkmatig rijdt. */
  function bouwWeg() {
    var w = weg.clientWidth;
    var h = weg.clientHeight;
    if (!w) return;
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    var basis = weg.getBoundingClientRect().left;
    var y = h / 2;
    var A = Math.min(26, h * 0.22);
    var pts = koppen.map(function (k) {
      var r = k.parentNode.getBoundingClientRect();
      return { x: r.left - basis + r.width / 2, y: y };
    });
    var d = 'M' + pts[0].x + ' ' + y;
    var tabel = [{ len: 0, x: pts[0].x, y: y }];
    var stationLen = [0];
    var len = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i], p3 = pts[i + 1];
      var dx = p3.x - p0.x;
      var dir = i % 2 === 0 ? -1 : 1;
      var p1 = { x: p0.x + dx * 0.36, y: y + dir * A };
      var p2 = { x: p3.x - dx * 0.36, y: y + dir * A };
      d += ' C' + p1.x + ' ' + p1.y + ' ' + p2.x + ' ' + p2.y + ' ' + p3.x + ' ' + p3.y;
      var vorige = p0;
      for (var s = 1; s <= 120; s++) {
        var q = cubic(p0, p1, p2, p3, s / 120);
        len += Math.hypot(q.x - vorige.x, q.y - vorige.y);
        tabel.push({ len: len, x: q.x, y: q.y });
        vorige = q;
      }
      stationLen.push(len);
    }
    grond.setAttribute('d', d);
    draad.setAttribute('d', d);
    pts.forEach(function (p, k) { knopen[k].setAttribute('transform', 'translate(' + p.x + ' ' + p.y + ')'); });
    geo = { tabel: tabel, totaal: len || 1, stationLen: stationLen };
    huisjes.forEach(function (hu) {
      hu.len = (stationLen[hu.i] + stationLen[hu.i + 1]) / 2;
      var p = puntOp(hu.len);
      hu.g.setAttribute('transform', 'translate(' + p.x + ' ' + p.y + ')');
    });
  }
  function puntOp(L) {
    var t = geo.tabel;
    var lo = 0, hi = t.length - 1;
    if (L <= 0) return t[0];
    if (L >= t[hi].len) return t[hi];
    while (hi - lo > 1) {
      var mid = (lo + hi) >> 1;
      if (t[mid].len < L) lo = mid; else hi = mid;
    }
    var a = t[lo], b = t[hi];
    var f = (L - a.len) / ((b.len - a.len) || 1);
    return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
  }
  /* Positie als halte-index met fractie (2.5 = halverwege halte 2 en 3), naar booglengte. */
  function lengteBij(pos) {
    var a = Math.floor(pos), b = Math.min(LAATSTE, a + 1);
    return geo.stationLen[a] + (geo.stationLen[b] - geo.stationLen[a]) * (pos - a);
  }

  function lijstYBij(pos) {
    var a = Math.floor(pos), b = Math.min(LAATSTE, a + 1);
    return lijstY[a] + (lijstY[b] - lijstY[a]) * (pos - a);
  }

  /* Toestand */

  function tekenPositie() {
    var bezochtTot = Math.floor(pos + 1e-6);
    if (!smal() && geo) {
      var L = lengteBij(pos);
      var p = puntOp(L);
      bol.setAttribute('transform', 'translate(' + p.x + ' ' + p.y + ')');
      draad.setAttribute('stroke-dashoffset', String(1000 - 1000 * (L / geo.totaal)));

    if (smal() && lijstY.length) {

      draadSm.style.height = Math.max(0, yy - lijstY[0]) + 'px';

      opbrengstenSm[i].classList.toggle('bezocht', bezocht);

    var ob = opbrengstVan(S[bezochtTot]);

  function zetBolIcoon(naam) {

    vulDetail(i);
    plaatsDetail();
    eind.classList.toggle('bereikt', i === LAATSTE);
    if (aankomst && !reduce) {
      [opbrengsten[i], opbrengstenSm[i]].forEach(function (o) {
        o.classList.remove('spring');
        void o.getBoundingClientRect();
        o.classList.add('spring');
      });
    }
    werkKnoppenBij();
  }
  function plaatsDetail() {
    if (smal()) {
      var slot = lijstItems[actief]._slot;
      if (detail.parentNode !== slot) slot.appendChild(detail);
      meetLijst();
    } else if (detail.parentNode !== root || detail.nextSibling !== onderbalk) {
      root.insertBefore(detail, onderbalk);
    }
  }

  function werkKnoppenBij() {
    kVorige.disabled = actief === 0 && !rit;
    kVolgende.disabled = actief === LAATSTE && !rit;
    var opFinish = actief === LAATSTE && !rit;
    var naam = opFinish ? 'opnieuw' : speelt ? 'pauze' : 'afspelen';
    var tekst = opFinish ? 'Opnieuw' : speelt ? 'Pauzeren' : 'Afspelen';
    kSpeel._use.setAttribute('href', '#i-' + naam);
    kSpeel._tekst.textContent = tekst;
    kSpeel.setAttribute('aria-pressed', speelt ? 'true' : 'false');
  }

  function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  function gaNaar(doel) {
    doel = Math.max(0, Math.min(LAATSTE, doel));
    if (rit) { pos = ritPositie(performance.now()); rit = null; }
    if (doel === pos && !rit) { zetActief(doel, false); tekenPositie(); return; }
    if (reduce) {
      pos = doel;
      tekenPositie();
      aangekomen(doel);
      return;
    }
    if (smal()) meetLijst();
    var afstand = smal() || !geo
      ? Math.abs(doel - pos) / Math.max(1, LAATSTE)
      : Math.abs(lengteBij(doel) - lengteBij(pos)) / geo.totaal;
    var duur = (0.7 + 2.1 * Math.min(1, afstand)) * 1000;
    rit = { van: pos, naar: doel, start: performance.now(), duur: duur };
    werkKnoppenBij();
  }
  function ritPositie(nu) {
    var t = Math.min(1, (nu - rit.start) / rit.duur);
    return rit.van + (rit.naar - rit.van) * easeInOut(t);
  }
  function aangekomen(i) {
    zetActief(i, true);
    if (i === LAATSTE) {
      speelt = false;
      werkKnoppenBij();
    } else if (speelt) {
      aftelStart = performance.now();
    }
    tekenPositie();
  }

  function lus(nu) {
    if (rit) {
      var t = Math.min(1, (nu - rit.start) / rit.duur);
      pos = ritPositie(nu);
      tekenPositie();
      if (t >= 1) {
        var doel = rit.naar;
        rit = null;
        pos = doel;
        aangekomen(doel);
      }
    } else if (speelt) {
      var verstreken = nu - aftelStart;
      if (verstreken >= WACHT_MS) {
        voortgangVul.style.width = '0';
        gaNaar(actief + 1);
      } else {
        voortgangVul.style.width = (100 * verstreken / WACHT_MS) + '%';
      }
    }
    if (!speelt || rit) voortgangVul.style.width = '0';
    requestAnimationFrame(lus);
  }

  function speel() {
    speelt = true;
    aftelStart = performance.now();
    werkKnoppenBij();
  }
  function pauzeer() {
    speelt = false;
    werkKnoppenBij();
  }
  /* Elke handmatige actie pauzeert het afspelen. */
  function handmatig(i) {
    pauzeer();
    gaNaar(i);
    if (smal()) {
      var li = lijstItems[i];
      if (li && li.scrollIntoView) li.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
    }
  }
  function speelKnop() {
    if (actief === LAATSTE && !rit) {
      gaNaar(0);
      if (!reduce) speelt = true;
      werkKnoppenBij();
      return;
    }
    if (speelt) pauzeer(); else speel();
  }

  kVorige.addEventListener('click', function () { handmatig((rit ? Math.round(pos) : actief) - 1); });
  kVolgende.addEventListener('click', function () { handmatig((rit ? Math.round(pos) : actief) + 1); });
  kSpeel.addEventListener('click', speelKnop);
  kScherm.addEventListener('click', function () {
    if (document.fullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
    } else if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(function () {});
    }
  });
  document.addEventListener('fullscreenchange', function () {
    kScherm._tekst.textContent = document.fullscreenElement ? 'Venster' : 'Volledig scherm';
  });
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var doelEl = e.target;
    var tag = doelEl && doelEl.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    var hier = rit ? Math.round(pos) : actief;
    switch (e.key) {
      case 'ArrowRight': case 'PageDown': e.preventDefault(); handmatig(hier + 1); break;
      case 'ArrowLeft': case 'PageUp': e.preventDefault(); handmatig(hier - 1); break;
      case 'Home': e.preventDefault(); handmatig(0); break;
      case 'End': e.preventDefault(); handmatig(LAATSTE); break;
      case ' ':
        if (tag === 'BUTTON') return;
        e.preventDefault();
        speelKnop();
        break;
    }
  });

  function herbouw() {
    bouwWeg();
    plaatsDetail();
    if (smal()) meetLijst();
    tekenPositie();
  }
  if (window.ResizeObserver) new ResizeObserver(herbouw).observe(root);
  else window.addEventListener('resize', herbouw);
  if (smalMedia.addEventListener) smalMedia.addEventListener('change', herbouw);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(herbouw);

  /* Start: alles staat meteen in beeld, de bol bij de Stand en de rode lijn tot daar. */
  zetActief(standIndex, false);
  herbouw();
  if (!reduce && standIndex < LAATSTE) speel();
  requestAnimationFrame(lus);
})();
</script>
</body>
</html>
