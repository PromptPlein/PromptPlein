<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!-- Niet indexeren: PromptPlein is alleen voor intern overheidsgebruik. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover: de onderbalk loopt door tot onder de thuisbalk van de
         telefoon. Inzoomen blijft bewust toegestaan (WCAG 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PromptPlein" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="description"
      content="Prompt Library voor de Nederlandse overheid - upload, deel, zoek en optimaliseer AI-prompts."
    />
    <title>PromptPlein</title>
    <script>
      // Pas het opgeslagen thema toe vóór de eerste paint (voorkomt flikkering).
      (function () {
        try {
          var stored = localStorage.getItem('opl-theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (stored === 'system' && prefersDark);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
