<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!-- Niet indexeren: PromptPlein is alleen voor intern overheidsgebruik. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prompt Library voor de Nederlandse overheid - upload, deel, zoek en optimaliseer AI-prompts."
    />
    <title>Overheid Prompt Library</title>
    <script>
      // Pas het opgeslagen thema toe vóór de eerste paint (voorkomt flikkering).
      (function () {
        try {
          var stored = localStorage.getItem('opl-theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (stored === 'system' && prefersDark);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
