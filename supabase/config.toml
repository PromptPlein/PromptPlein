# Supabase project-configuratie.
# Vervang project_id door je eigen project ref bij `supabase link`.
project_id = "overheid-prompt-library"

[functions.optimize-prompt]
# JWT-verificatie staat aan; de frontend stuurt de anon key mee.
verify_jwt = true

[functions.send-contact]
# JWT-verificatie staat uit: het contactformulier is ook bruikbaar door
# niet-ingelogde bezoekers. De anon key blijft verplicht via de gateway.
verify_jwt = false

[functions.register-brevo-contact]
# JWT-verificatie staat uit: deze functie wordt door een database-trigger
# (pg_net) aangeroepen, niet door een ingelogde gebruiker. Authenticatie
# gebeurt via het gedeelde geheim in de header x-webhook-secret.
verify_jwt = false

[functions.brevo-event]
# JWT-verificatie staat uit: deze functie wordt door database-triggers (pg_net)
# aangeroepen. Authenticatie gebeurt via het gedeelde geheim in de header
# x-webhook-secret, net als bij register-brevo-contact.
verify_jwt = false

[functions.auth-email]
# JWT-verificatie staat uit: Supabase Auth roept deze functie aan als Send Email
# Hook. Authenticatie gebeurt met de handtekening van de hook (standard webhooks),
# met het geheim in SEND_EMAIL_HOOK_SECRET.
verify_jwt = false

[functions.delete-account]
# JWT-verificatie staat aan: alleen een ingelogde gebruiker verwijdert zijn eigen
# account. De functie leest de gebruiker zelf uit het token, nooit uit de body.
verify_jwt = true
